<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mr10x | تسليم المنتج واستخراج الرمز</title>
<style>
:root{color-scheme:dark;--bg:#0b1410;--panel:#192b22;--field:#12241b;--line:#355743;--accent:#39d7a3;--muted:#a4bdad}
*{box-sizing:border-box}body{background:radial-gradient(ellipse at top,#16382b,var(--bg) 75%);min-height:100vh;margin:0;padding:35px 14px;color:#f4fff6;font:15px/1.8 system-ui,sans-serif}
main{max-width:540px;margin:20px auto;background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:20px;box-shadow:0 22px 65px #0005}
h1{text-align:center;font-size:30px;margin:0;color:var(--accent)}p.help{text-align:center;color:var(--muted);margin-top:0}h2{font-size:19px;margin:26px 0 8px}
.field{border-radius:12px;border:1px solid var(--line);padding:12px 14px;margin:10px 0;background:var(--field)}.field label{display:block;color:var(--muted);font-size:13px}
.field .value{display:flex;gap:10px;align-items:center;justify-content:space-between;overflow-wrap:anywhere;direction:ltr;text-align:left;font-size:16px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;background:var(--accent);color:#06281a}
button.secondary{background:#234635;color:white;border:1px solid var(--line);font-size:13px}button:disabled{opacity:.55;cursor:wait}button.main{width:100%;margin-top:12px;padding:15px}#delivery[hidden]{display:none}
.notice{font-size:13px;color:var(--muted);padding:12px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}.error{color:#ffafaf}#code{font-weight:800;text-align:center;font-size:30px;color:var(--accent);direction:ltr}
</style></head>
<body><main>
<h1>Mr10x</h1><p class="help">استلام بيانات المنتج والرمز دون إنشاء حساب</p>
<p id="state" class="notice" role="status">جارٍ فحص رابط التسليم...</p>
<div id="delivery" hidden>
<h2 id="serviceTitle">تفاصيل المنتج</h2>
<div class="field"><label>البريد الإلكتروني الخاص بالمنتج</label><div class="value"><span id="productEmail"></span><button id="copyEmail" class="secondary" type="button">نسخ</button></div></div>
<div class="field"><label>كلمة مرور المنتج</label><div class="value"><span id="productPassword" dir="ltr">••••••••</span><div><button id="togglePassword" class="secondary" type="button">إظهار</button><button id="copyPassword" class="secondary" type="button">نسخ</button></div></div></div>
<button id="extractButton" class="main" type="button">استخراج كود التحقق</button>
<p id="codeStatus" class="notice" role="status">اضغط الزر لبدء البحث عن رمز هذا الطلب. سيُحدّث تلقائيًا عند وصول رسالة مطابقة.</p>
<div id="code" aria-live="polite"></div>
<p class="help">تنبيه: هذا الرابط خاص بالطلب. لا ترسله لأي شخص آخر، ولا تستخدمه إلا لبيانات الحساب الذي يحق للمتجر تسليمه.</p>
</div></main>
<script type="module">
import {requireApiBase} from './mail-bridge-config.js';
const $=id=>document.getElementById(id);
const url=new URL(location.href);
const token=url.searchParams.get('token')||'';
const access=new URLSearchParams(url.hash.replace(/^#/,'' )).get('access')||'';
const validToken=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(token);
const validAccess=/^[A-Za-z0-9_-]{43}$/.test(access);
let credentialEmail='',credentialPassword='',timer=null,busy=false,until=0;
function text(id,value){$(id).textContent=value;}
async function check(includeCode=false){
 if(busy)return;
 busy=true;
 try{
  const r=await fetch(`${requireApiBase()}/api/customer/guest/status`,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageToken:token,accessKey:access,includeCode})});
  const result=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(result.error||'تعذر التحقق من رابط التسليم');
  if(result.status==='unavailable'){
   text('state','انتهت صلاحية الطلب أو الرمز؛ تواصل مع المتجر.');$('extractButton').disabled=true;stop();return;
  }
  credentialEmail=result.account_email;credentialPassword=result.account_password;
  text('productEmail',credentialEmail);text('serviceTitle',result.service);
  $('delivery').hidden=false;text('state','رابط التسليم الخاص صالح');
  if(includeCode){
   if(result.status==='received' && result.code){text('codeStatus','وصل الرمز لهذا الطلب');text('code',result.code);stop();}
   else if(result.status==='code_unavailable'){text('codeStatus','انتهت صلاحية الكود السابق؛ تواصل مع المتجر لطلب جديد.');stop();}
   else{text('codeStatus','لم يصل رمز مطابق بعد. يتم الفحص تلقائيًا كل 8 ثوانٍ.');}
  }
 }catch(e){text('state',e.message);$('state').classList.add('error');if(includeCode){stop();text('codeStatus','تعذر الاستعلام. جرّب بعد قليل.');}}
 finally{busy=false;}
}
function stop(){if(timer){clearInterval(timer);timer=null;} $('extractButton').disabled=false;}
$('togglePassword').onclick=()=>{const x=$('productPassword');const show=x.textContent==='••••••••';x.textContent=show?credentialPassword:'••••••••';$('togglePassword').textContent=show?'إخفاء':'إظهار';};
async function copy(value){try{await navigator.clipboard.writeText(value);text('state','تم النسخ');}catch(_){text('state','تعذر النسخ التلقائي');}}
$('copyEmail').onclick=()=>copy(credentialEmail);$('copyPassword').onclick=()=>copy(credentialPassword);
$('extractButton').onclick=()=>{if(timer)return;$('extractButton').disabled=true;until=Date.now()+5*60_000;check(true);timer=setInterval(()=>{if(Date.now()>=until){stop();text('codeStatus','انتهت مهلة الانتظار. اضغط لاستخراج الكود مرة أخرى.');}else check(true);},8000);};
if(validToken && validAccess)check();else text('state','رابط التسليم غير مكتمل. افتح الرابط الخاص الذي أرسله لك المتجر.');
</script></body></html>
