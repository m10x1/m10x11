
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1410">
<title>Mr10x | صفحة العميل</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1410;
  --card:#19231f;
  --inside:#202c26;
  --border:#30463a;
  --green:#39d7a3;
  --green2:#22c9c8;
  --white:#f2f6f1;
  --muted:#96aaa0;
  --red:#ff9696;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      ellipse at 50% 15%,
      #123027 0%,
      transparent 45%
    ),
    var(--bg);
  color:var(--white);
  font-family:Cairo,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:45px 15px;
}

button,input{font:inherit}

button{cursor:pointer}

.page{
  width:100%;
  max-width:500px;
}

.card{
  background:var(--card);
  border:1px solid #ffffff12;
  border-radius:21px;
  overflow:hidden;
  box-shadow:0 25px 80px #0006;
}

.top{
  text-align:center;
  padding:27px 22px 25px;
  position:relative;
}

.lang{
  position:absolute;
  top:15px;
  left:15px;
  border:1px solid var(--border);
  background:#21332b;
  color:var(--green);
  border-radius:9px;
  padding:5px 12px;
  font-size:12px;
}

.brand{
  width:68px;
  height:68px;
  margin:0 auto 15px;
  background:linear-gradient(145deg,#e9f2e8,#a9d7bb);
  color:#123a2a;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:900;
}

.top h1{
  font-size:23px;
  font-weight:900;
  margin:4px 0;
}

.top p{
  color:var(--muted);
  font-size:12px;
  margin:0;
}

.divider{
  height:1px;
  background:#ffffff12;
}

.content{
  padding:22px;
}

.store-name{
  text-align:center;
  font-size:14px;
  color:var(--green);
  font-weight:800;
  margin-bottom:20px;
}

.field{
  background:var(--inside);
  border:1px solid #ffffff12;
  border-radius:12px;
  padding:13px 15px;
  margin-bottom:12px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.field-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.field input{
  width:100%;
  min-width:0;
  background:transparent;
  border:0;
  outline:0;
  color:var(--white);
  font-size:14px;
  direction:ltr;
  text-align:start;
}

.field input::placeholder{
  color:#6f8779;
}

.field:focus-within{
  border-color:var(--green);
}

.icon-btn{
  flex-shrink:0;
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:12px;
  padding:5px;
}

.icon-btn:hover{color:var(--green)}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  margin:5px 0 13px;
  font-weight:900;
  color:#09261d;
  background:linear-gradient(
    110deg,
    var(--green),
    var(--green2)
  );
  transition:.25s;
}

.primary:hover{
  filter:brightness(1.08);
  transform:translateY(-2px);
}

.primary:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.status{
  background:#142b21;
  border:1px solid #23523d;
  border-radius:12px;
  text-align:center;
  padding:18px;
  margin-bottom:15px;
}

.status small{
  display:block;
  font-size:11px;
  color:var(--muted);
}

.status strong{
  display:block;
  color:var(--green);
  font-size:21px;
  font-weight:900;
  margin-top:5px;
}

.timer{
  direction:ltr;
  font-size:14px;
  color:#badacb;
  margin-top:7px;
}

.instructions{
  background:#14271e;
  border:1px solid #27553e;
  border-radius:13px;
  padding:16px;
}

.instructions h3{
  margin:0 0 12px;
  font-size:14px;
  color:var(--green);
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  background:#203029;
  border:1px solid #ffffff0c;
  padding:11px;
  margin-top:7px;
  border-radius:9px;
  color:#b9c8be;
  font-size:11px;
}

.num{
  flex-shrink:0;
  width:26px;
  height:26px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--green);
  background:#1e4e37;
  font-weight:900;
}

.notice{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:15px 0 0;
  min-height:24px;
}

.footer{
  width:max-content;
  margin:20px auto 0;
  border:1px solid #244b39;
  border-radius:30px;
  padding:7px 17px;
  color:#819c8c;
  font-size:10px;
}

.footer b{color:var(--green)}
.error{color:var(--red)!important}
.hidden{display:none!important}

@media(max-width:500px){
  body{padding:22px 12px}
  .content{padding:16px}
  .top h1{font-size:20px}
}
</style>
</head>

<body>

<div class="page">

<section class="card">

  <div class="top">

    <button
      class="lang"
      id="langButton"
      type="button"
    >English</button>

    <div class="brand">M</div>

    <h1
      data-ar="حسابك في Mr10x"
      data-en="Your Mr10x Account"
    >حسابك في Mr10x</h1>

    <p
      data-ar="سجل دخولك لمتابعة طلبك"
      data-en="Sign in to view your order"
    >سجل دخولك لمتابعة طلبك</p>

  </div>

  <div class="divider"></div>

  <div class="content">

    <div class="store-name" id="storeName">
      Mr10x
    </div>

    <form id="loginForm">

      <div class="field">
        <label
          for="email"
          data-ar="البريد الإلكتروني"
          data-en="Email Address"
        >البريد الإلكتروني</label>

        <div class="field-row">
          <input
            id="email"
            type="email"
            placeholder="example@email.com"
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="field">

        <label
          for="password"
          data-ar="كلمة المرور"
          data-en="Password"
        >كلمة المرور</label>

        <div class="field-row">

          <input
            id="password"
            type="password"
            placeholder="••••••••••"
            autocomplete="current-password"
            required
          >

          <button
            class="icon-btn"
            type="button"
            id="togglePassword"
            data-ar="إظهار"
            data-en="Show"
          >إظهار</button>

        </div>
      </div>

      <button
        class="primary"
        id="loginButton"
        type="submit"
      >
        <span
          data-ar="تسجيل الدخول"
          data-en="Sign In"
        >تسجيل الدخول</span>
      </button>

    </form>

    <div class="status">
      <small
        data-ar="حالة رابط العميل"
        data-en="Customer Link Status"
      >حالة رابط العميل</small>

      <strong id="statusText">
        جارٍ التحقق...
      </strong>

      <div class="timer" id="countdown">
        --:--:--
      </div>
    </div>

    <div class="instructions">

      <h3
        data-ar="خطوات الاستخدام"
        data-en="Instructions"
      >خطوات الاستخدام</h3>

      <div class="step">
        <span class="num">1</span>
        <span
          data-ar="سجّل الدخول بحسابك في Mr10x."
          data-en="Sign in with your Mr10x account."
        >سجّل الدخول بحسابك في Mr10x.</span>
      </div>

      <div class="step">
        <span class="num">2</span>
        <span
          data-ar="يتحقق النظام من حسابك وصلاحية الرابط."
          data-en="Your account and link are verified."
        >يتحقق النظام من حسابك وصلاحية الرابط.</span>
      </div>

      <div class="step">
        <span class="num">3</span>
        <span
          data-ar="تابع حالة طلبك داخل المنصة."
          data-en="Track your order in the platform."
        >تابع حالة طلبك داخل المنصة.</span>
      </div>

    </div>

    <p class="notice" id="notice" role="status">
      يتم التحقق من الرابط...
    </p>

  </div>
</section>

<div class="footer">
  Powered by <b>Mr10x</b>
</div>

</div>

<script type="module">

import {createClient}
from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
  "https://ojlkgvwzzkctjywooogx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YDaAejoRn0hHcECxdQmVqw_EBcdgNiD";

const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);

let language="ar";
let expiresAt=null;
let validLink=false;
let verifiedStore="Mr10x";

const words={
  ar:{
    checking:"جارٍ التحقق...",
    active:"الرابط فعّال",
    invalid:"الرابط غير صالح",
    expired:"انتهت صلاحية الرابط",
    missing:"رابط العميل غير موجود",
    failed:"تعذر الاتصال بالخدمة",
    login:"تم تسجيل الدخول بنجاح",
    loginFailed:"تعذر تسجيل الدخول. تحقق من بيانات الحساب.",
    ready:"يمكنك تسجيل الدخول بحساب Mr10x.",
    pending:"الرابط غير جاهز للاستخدام.",
    show:"إظهار",
    hide:"إخفاء"
  },
  en:{
    checking:"Checking...",
    active:"Link Active",
    invalid:"Invalid Link",
    expired:"Link Expired",
    missing:"Customer link not found",
    failed:"Service unavailable",
    login:"Signed in successfully",
    loginFailed:"Sign in failed. Check your credentials.",
    ready:"You can sign in with your Mr10x account.",
    pending:"This link is not ready.",
    show:"Show",
    hide:"Hide"
  }
};

function setStatus(key){
  $("statusText").dataset.key=key;
  $("statusText").textContent=words[language][key];

  $("statusText").classList.toggle(
    "error",
    ["invalid","expired","missing","failed"].includes(key)
  );
}

function note(key){
  $("notice").dataset.key=key;
  $("notice").textContent=words[language][key];
}

function updateLanguage(){
  document.documentElement.lang=language;
  document.documentElement.dir=
    language==="ar"?"rtl":"ltr";

  document.querySelectorAll("[data-ar][data-en]")
    .forEach(el=>{
      el.textContent=el.dataset[language];
    });

  $("langButton").textContent=
    language==="ar"?"English":"العربية";

  const statusKey=$("statusText").dataset.key;
  if(statusKey)setStatus(statusKey);

  const noticeKey=$("notice").dataset.key;
  if(noticeKey)note(noticeKey);

  $("togglePassword").textContent=
    $("password").type==="password"
      ?words[language].show
      :words[language].hide;
}

$("langButton").addEventListener("click",()=>{
  language=language==="ar"?"en":"ar";
  updateLanguage();
});

$("togglePassword").addEventListener("click",()=>{
  const input=$("password");

  input.type=input.type==="password"
    ?"text":"password";

  $("togglePassword").textContent=
    input.type==="password"
      ?words[language].show
      :words[language].hide;
});

function updateTimer(){
  if(!expiresAt)return;

  const remaining=expiresAt.getTime()-Date.now();

  if(remaining<=0){
    validLink=false;
    setStatus("expired");
    $("countdown").textContent="00:00:00";
    $("loginButton").disabled=true;
    return;
  }

  const seconds=Math.floor(remaining/1000);
  const days=Math.floor(seconds/86400);
  const hours=Math.floor((seconds%86400)/3600);
  const minutes=Math.floor((seconds%3600)/60);
  const secs=seconds%60;
  const pad=n=>String(n).padStart(2,"0");

  $("countdown").textContent=
    (days?days+"d ":"")+
    pad(hours)+":"+
    pad(minutes)+":"+
    pad(secs);
}

async function checkLink(){
  const token=new URLSearchParams(location.search)
    .get("token");

  const uuid=
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

  if(!token){
    setStatus("missing");
    note("pending");
    $("loginButton").disabled=true;
    return;
  }

  if(!uuid.test(token)){
    setStatus("invalid");
    note("pending");
    $("loginButton").disabled=true;
    return;
  }

  try{
    const {data,error}=await db.rpc(
      "mr_public_customer_link",
      {p_token:token}
    );

    if(error)throw error;

    const record=Array.isArray(data)
      ?data[0]:data;

    if(!record){
      setStatus("invalid");
      note("pending");
      $("loginButton").disabled=true;
      return;
    }

    expiresAt=new Date(record.expires_at);
    verifiedStore=record.store_name||"Mr10x";

    $("storeName").textContent=verifiedStore;

    if(!Number.isFinite(expiresAt.getTime())){
      throw Error("Invalid expiry");
    }

    validLink=expiresAt.getTime()>Date.now();

    setStatus(validLink?"active":"expired");
    note(validLink?"ready":"pending");
    $("loginButton").disabled=!validLink;

    updateTimer();
  }catch(error){
    console.error(error);
    setStatus("failed");
    note("pending");
    $("loginButton").disabled=true;
  }
}

$("loginForm").addEventListener("submit",async event=>{
  event.preventDefault();

  if(!validLink)return;

  const button=$("loginButton");
  button.disabled=true;

  try{
    const {data,error}=await db.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });

    if(error)throw error;

    $("password").value="";

    // Signing in authenticates this account with Mr10x.
    // It does not grant access to any third-party account.
    // An order-ownership check must be added before
    // showing private order information.

    note("login");

  }catch(error){
    console.error("Mr10x sign-in failed");
    note("loginFailed");
  }finally{
    button.disabled=!validLink;
  }
});

setStatus("checking");
note("pending");
checkLink();

setInterval(updateTimer,1000);

</script>
</body>
</html>
