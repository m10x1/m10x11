
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#1E302A">

  <title>إنشاء حساب | Mr10x</title>

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --olive: #1E302A;
      --olive-light: #30453A;
      --sage: #A7C4A0;
      --beige: #F1EDE3;
      --muted: #C0CBBF;
    }

    body {
      margin: 0;
      background: var(--olive);
      color: var(--beige);
      font-family: 'Cairo', sans-serif;
    }

    .register-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(167,196,160,.12),
          transparent 40%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(241,237,227,.06),
          transparent 40%
        );
    }

    .register-box {
      width: 100%;
      max-width: 480px;
      padding: 36px;
      background: #263B31;
      border: 1px solid #496052;
      border-radius: 24px;
      box-shadow: 0 20px 60px
        rgba(0,0,0,.2);
      animation: fadeUp .8s ease both;
      box-sizing: border-box;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      text-align: center;
      font-size: 35px;
      font-weight: 900;
      margin: 0 0 5px;
    }

    .brand span {
      color: var(--sage);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin: 0 0 32px;
      font-size: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      margin-bottom: 22px;
      background: #1E302A;
      border: 1px solid #496052;
      border-radius: 12px;
      color: var(--beige);
      outline: none;
      font: inherit;
      transition:
        border-color .25s,
        box-shadow .25s;
    }

    input::placeholder {
      color: #A5B4A8;
    }

    input:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px
        rgba(167,196,160,.12);
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: linear-gradient(
        110deg,
        #A7C4A0,
        #D8D0B9
      );
      color: #17291F;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform .25s,
        box-shadow .25s;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px
        rgba(167,196,160,.2);
    }

    .submit-btn:active {
      transform: scale(.98);
    }

    .notice {
      text-align: center;
      margin-top: 24px;
      padding: 15px;
      border: 1px solid #496052;
      border-radius: 12px;
      background: rgba(167,196,160,.06);
      color: var(--muted);
      font-size: 13px;
      line-height: 2;
    }

    .notice strong {
      color: var(--sage);
    }

    #registerStatus {
      text-align: center;
      color: var(--sage);
      font-size: 14px;
      line-height: 2;
      margin-top: 18px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: var(--sage);
      font-weight: 700;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    .disclaimer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 22px;
    }

    @media (max-width: 500px) {
      .register-box {
        padding: 25px 20px;
      }

      .brand {
        font-size: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .register-box {
        animation: none;
      }

      .submit-btn,
      input {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="register-page">

    <div class="register-box">

      <h1 class="brand">
        Mr<span>10x</span>
      </h1>

      <p class="subtitle">
        إنشاء حساب متجر جديد
      </p>

      <form id="registerForm">

        <label for="customerName">
          اسم العميل
        </label>

        <input
          type="text"
          id="customerName"
          name="customerName"
          placeholder="أدخل اسمك"
          autocomplete="name"
          maxlength="80"
          required
        >

        <label for="storeName">
          اسم المتجر
        </label>

        <input
          type="text"
          id="storeName"
          name="storeName"
          placeholder="أدخل اسم متجرك"
          maxlength="100"
          required
        >

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >

        <label for="password">
          كلمة مرور حساب Mr10x
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="8 أحرف على الأقل"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button
          type="submit"
          class="submit-btn"
        >
          إنشاء الحساب
        </button>

        <p id="registerStatus"
           role="status"
           aria-live="polite"></p>

      </form>

      <div class="notice">
        ⏳ مدة التواصل المتوقعة
        <br>
        <strong>من ساعة إلى 24 ساعة</strong>
        <br>
        بعد استلام الطلب ومراجعته.
      </div>

      <a class="back" href="index.html">
        ← العودة إلى الرئيسية
      </a>

      <p class="disclaimer">
        هذه واجهة تجريبية.
        لم يتم تفعيل إنشاء الحسابات
        أو استقبال الطلبات بعد.
      </p>

    </div>

  </main>

  <script>
    const form = document.getElementById(
      'registerForm'
    );

    const status = document.getElementById(
      'registerStatus'
    );

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      status.textContent =
        '✓ النموذج مكتمل. بعد تفعيل استقبال الطلبات، سيتم التواصل معكم خلال ساعة إلى 24 ساعة.';

      status.style.color = '#A7C4A0';
    });
  </script>

</body>
</html>
