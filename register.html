
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>إنشاء حساب | Mr10x</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .register-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 16px;
    }

    .register-box {
      width: 100%;
      max-width: 480px;
      background: #111a17;
      border: 1px solid #263630;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 25px 70px
        rgba(0, 0, 0, .3);
    }

    .register-box h1 {
      text-align: center;
      font-size: 32px;
      margin: 0 0 8px;
    }

    .register-box h1 span {
      color: #39dfa0;
    }

    .register-box p {
      text-align: center;
      color: #94a8a0;
      margin-bottom: 30px;
    }

    .register-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .register-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #0c1511;
      color: white;
      border: 1px solid #263630;
      border-radius: 10px;
      outline: none;
    }

    .register-box input:focus {
      border-color: #39dfa0;
    }

    .register-box button {
      width: 100%;
    }

    .register-box .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #39dfa0;
    }

    .register-box .notice {
      font-size: 12px;
      margin-top: 20px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>

  <main class="register-page">

    <div class="register-box">

      <h1>Mr<span>10x</span></h1>

      <p>إنشاء حساب متجر جديد</p>

      <form id="registerForm">

        <label for="customerName">
          اسم العميل
        </label>
        <input
          type="text"
          id="customerName"
          name="customerName"
          placeholder="أدخل اسمك"
          autocomplete="name"
          maxlength="80"
          required
        >

        <label for="storeName">
          اسم المتجر
        </label>
        <input
          type="text"
          id="storeName"
          name="storeName"
          placeholder="أدخل اسم متجرك"
          maxlength="100"
          required
        >

        <label for="email">
          البريد الإلكتروني
        </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >

        <label for="password">
          كلمة مرور حساب Mr10x
        </label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="8 أحرف على الأقل"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button
          type="submit"
          class="primary-btn"
        >
          إنشاء الحساب
        </button>

        <p id="registerStatus"
           role="status"
           aria-live="polite"></p>

      </form>

      <a class="back" href="index.html">
        العودة للرئيسية
      </a>

      <p class="notice">
        هذه واجهة تجريبية.
        إنشاء الحسابات الفعلية يحتاج
        خدمة مصادقة آمنة.
      </p>

    </div>

  </main>

  <script>
    const form = document.getElementById(
      'registerForm'
    );

    const status = document.getElementById(
      'registerStatus'
    );

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      status.style.color = '#39dfa0';
      status.textContent =
        'النموذج جاهز. سنفعّل إنشاء الحساب بعد ربط نظام التسجيل الآمن.';
    });
  </script>

</body>
</html>
