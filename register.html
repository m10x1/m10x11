
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E302A">
  <title>إنشاء حساب | Mr10x</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #1E302A;
      --card: #30453A;
      --input: #24382E;
      --border: #526859;
      --sage: #A7C4A0;
      --beige: #F1EDE3;
      --muted: #C7D0C3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Cairo', sans-serif;
      background: var(--background);
      color: var(--beige);
      direction: rtl;
    }

    .page {
      min-height: 100vh;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(167,196,160,.12),
          transparent 38%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(241,237,227,.07),
          transparent 40%
        ),
        var(--background);
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      filter: blur(75px);
      opacity: .17;
      background: var(--sage);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .page::before {
      top: 8%;
      right: 8%;
    }

    .page::after {
      bottom: 8%;
      left: 8%;
      animation-delay: -4s;
    }

    .register-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 38px 34px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 24px 65px rgba(0,0,0,.22);
      animation: fadeUp .75s ease both;
    }

    .logo {
      margin: 0;
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      color: var(--beige);
    }

    .logo span {
      color: var(--sage);
    }

    .subtitle {
      margin: 4px 0 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input);
      color: var(--beige);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition:
        border-color .25s,
        box-shadow .25s,
        transform .25s;
    }

    input::placeholder {
      color: #AAB9A9;
    }

    input:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(167,196,160,.14);
      transform: translateY(-1px);
    }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(110deg, #A7C4A0, #E0D7C1);
      color: #1E302A;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .25s, box-shadow .25s;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(167,196,160,.2);
    }

    .submit-btn:active {
      transform: scale(.98);
    }

    .notice {
      margin-top: 22px;
      padding: 17px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(167,196,160,.07);
      line-height: 2;
      font-size: 13px;
      color: var(--muted);
    }

    .notice strong {
      color: var(--beige);
      font-size: 16px;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: var(--sage);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .back:hover {
      color: var(--beige);
    }

    .disclaimer {
      margin: 22px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.9;
    }

    #registerStatus {
      margin: 16px 0 0;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--sage);
      line-height: 2;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-25px);
      }
    }

    @media (max-width: 500px) {
      .register-box {
        padding: 28px 21px;
      }

      .logo {
        font-size: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="register-box">

      <h1 class="logo">Mr<span>10x</span></h1>

      <p class="subtitle">
        إنشاء حساب متجر جديد
      </p>

      <form id="registerForm">

        <div class="field">
          <label for="customerName">اسم العميل</label>
          <input
            type="text"
            id="customerName"
            name="customerName"
            placeholder="أدخل اسمك"
            autocomplete="name"
            maxlength="80"
            required
          >
        </div>

        <div class="field">
          <label for="storeName">اسم المتجر</label>
          <input
            type="text"
            id="storeName"
            name="storeName"
            placeholder="أدخل اسم متجرك"
            maxlength="100"
            required
          >
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">
            كلمة مرور حساب Mr10x
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="8 أحرف على الأقل"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button type="submit" class="submit-btn">
          إنشاء الحساب
        </button>

        <p id="registerStatus"
           role="status"
           aria-live="polite"></p>

      </form>

      <div class="notice">
        ⏳ مدة التواصل المتوقعة
        <br>
        <strong>من ساعة إلى 24 ساعة</strong>
        <br>
        بعد استلام الطلب ومراجعته
      </div>

      <a class="back" href="index.html">
        العودة إلى الرئيسية
      </a>

      <p class="disclaimer">
        هذه نسخة تجريبية.
        لم يتم تفعيل إنشاء الحسابات
        أو إرسال الطلبات بعد.
      </p>

    </section>
  </main>

  <script>
    document.getElementById('registerForm')
      .addEventListener('submit', function(event) {
        event.preventDefault();

        if (!this.reportValidity()) {
          return;
        }

        const status = document.getElementById(
          'registerStatus'
        );

        status.innerHTML =
          '✅ سوف يتم التواصل معكم خلال ساعة إلى 24 ساعة بعد مراجعة طلبكم.<br>شكرًا لاختياركم Mr10x 💚';
      });
  </script>

</body>
</html>
